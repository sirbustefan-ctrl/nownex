<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOWNEX</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    button, input { font: inherit; }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #splash {
      padding: 0;
      background: #000;
    }

    #splash video {
      width: 100%;
      height: 100vh;
      object-fit: cover;
    }

    .hidden { display: none !important; }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 5px;
      margin-bottom: 30px;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid #263247;
      border-radius: 20px;
      padding: 25px;
    }

    h2 { margin-top: 0; }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #34445d;
      background: #080b12;
      color: white;
      margin: 12px 0;
      outline: none;
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: #080b12;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      color: #ff8585;
      font-size: 14px;
      margin-top: 12px;
      line-height: 1.5;
    }

    #app {
      min-height: 100vh;
      padding: 35px 18px 110px;
      max-width: 700px;
      margin: auto;
    }

    .top-logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 35px;
    }

    .section {
      background: #111827;
      border: 1px solid #263247;
      border-radius: 18px;
      padding: 22px;
      min-height: 180px;
    }

    .row {
      padding: 13px 0;
      border-bottom: 1px solid #293449;
      overflow-wrap: anywhere;
    }

    .row:last-child { border-bottom: 0; }

    .label {
      color: #8fa0b8;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .value { font-size: 16px; }

    .menu {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 600px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 3px;
      padding: 9px 5px;
      border-radius: 22px;
      background: #182235;
      border: 1px solid #34445d;
      z-index: 10;
    }

    .menu button {
      flex: 1;
      min-width: 0;
      padding: 12px 2px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: #aab6c8;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .menu button.active {
      background: white;
      color: #080b12;
    }

    .small-note {
      color: #8fa0b8;
      font-size: 13px;
      line-height: 1.5;
    }

    .avatar-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0 25px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid #34445d;
      background: #080b12;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      color: white;
      font-size: 42px;
      font-weight: 300;
      padding: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-help {
      color: #8fa0b8;
      font-size: 12px;
      margin-top: 10px;
    }

    .delete-avatar-btn {
      margin-top: 12px;
      padding: 10px 20px;
      border: 1px solid #9b3d48;
      border-radius: 10px;
      background: transparent;
      color: #ff8585;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .avatar-message {
      color: #ff8585;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      line-height: 1.5;
    }

    #avatarInput {
      display: none;
    }

    /* HOME PAGE CONNECTION */

    #app.home-mode {
      padding: 0 0 100px;
      max-width: none;
      width: 100%;
    }

    #app.home-mode .top-logo {
      display: none;
    }

    #app.home-mode #content {
      width: 100%;
      margin: 0;
    }

    .home-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 90px);
      min-height: 500px;
      border: 0;
      background: #080b12;
    }
  </style>
</head>

<body>

  <div id="splash" class="screen">
    <video id="introVideo" autoplay muted playsinline loop>
      <source src="2026-11-05%2011%3A50%3A39.mov" type="video/quicktime">
    </video>
  </div>

  <div id="register" class="screen hidden">
    <div class="logo">NOWNEX</div>

    <div class="panel">
      <h2>CREATE ACCOUNT</h2>
      <p class="small-note">Choose your NOWNEX username.</p>

      <form id="registerForm">
        <input
          id="usernameInput"
          type="text"
          placeholder="Username"
          minlength="3"
          maxlength="20"
          autocomplete="username"
          required
        >

        <button class="main-btn" type="submit">REGISTER</button>
      </form>

      <div id="registerMessage" class="message"></div>
    </div>
  </div>

  <div id="loading" class="screen hidden">
    <div class="logo">NOWNEX</div>
    <p id="loadingMessage">Loading...</p>
  </div>

  <main id="app" class="hidden">
    <div class="top-logo">NOWNEX</div>
    <div id="content"></div>
  </main>

  <nav id="menu" class="menu hidden">
    <button data-page="packages">PACKAGES</button>
    <button data-page="balance">BALANCE</button>
    <button data-page="home" class="active">HOME</button>
    <button data-page="statistics">STATISTICS</button>
    <button data-page="profile">PROFILE</button>
  </nav>

  <input
    type="file"
    id="avatarInput"
    accept="image/jpeg,image/png,image/webp"
  >

  <script>
    const SUPABASE_URL = "https://gmgcyyhhdtqhtpfqbydg.supabase.co";
    const FUNCTION_URL = SUPABASE_URL + "/functions/v1/rapid-function";
    const PUBLISHABLE_KEY = "sb_publishable_CmYdFutjywR_FOG51tWr5Q_VMcI5Huj";

    const tg = window.Telegram?.WebApp;

    let profile = null;
    let requestBusy = false;
    let avatarBusy = false;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const $ = id => document.getElementById(id);

    function show(id) {
      ["splash", "register", "loading", "app"].forEach(name => {
        $(name).classList.toggle("hidden", name !== id);
      });

      $("menu").classList.toggle("hidden", id !== "app");
    }

    function showMessage(id, text) {
      $(id).textContent = text;
    }

    async function callFunction(username, extra = {}) {
      if (!tg?.initData) {
        throw new Error("Please open NOWNEX through Telegram.");
      }

      const body = {
        initData: tg.initData,
        ...extra
      };

      if (username) {
        body.username = username;
      }

      const response = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": PUBLISHABLE_KEY,
          "Authorization": "Bearer " + PUBLISHABLE_KEY
        },
        body: JSON.stringify(body)
      });

      const result = await response.json().catch(() => ({}));

      if (!response.ok || result.error) {
        throw new Error(
          result.error || result.message || "Something went wrong."
        );
      }

      return result;
    }

    function enterApp(data) {
      profile = data;
      show("app");
      openPage("home");
    }

    function openPage(page) {
      document.querySelectorAll(".menu button").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.page === page
        );
      });

      const content = $("content");
      content.replaceChildren();

      $("app").classList.toggle("home-mode", page === "home");

      if (page === "home") {
        const frame = document.createElement("iframe");
        frame.className = "home-frame";
        frame.src = "home.html";
        frame.title = "NOWNEX Home";

        content.append(frame);
        return;
      }

      const section = document.createElement("section");
      section.className = "section";

      const title = document.createElement("h2");
      const description = document.createElement("p");
      description.className = "small-note";

      if (page === "packages") {
        title.textContent = "PACKAGES";
        description.textContent = "Packages will be available here.";
        section.append(title, description);
      }

      if (page === "balance") {
        title.textContent = "BALANCE";
        description.textContent = "Your balance information will appear here.";
        section.append(title, description);
      }

      if (page === "statistics") {
        title.textContent = "STATISTICS";
        description.textContent = "Your statistics will appear here.";
        section.append(title, description);
      }

      if (page === "profile") {
        title.textContent = "PROFILE";
        section.append(title);

        const avatarArea = document.createElement("div");
        avatarArea.className = "avatar-area";

        const avatarButton = document.createElement("button");
        avatarButton.type = "button";
        avatarButton.className = "avatar";
        avatarButton.setAttribute("aria-label", "Choose profile picture");

        if (profile?.avatar_url) {
          const image = document.createElement("img");
          image.src = profile.avatar_url;
          image.alt = "Profile picture";
          avatarButton.append(image);
        } else {
          avatarButton.textContent = "+";
        }

        avatarButton.addEventListener("click", () => {
          if (!avatarBusy) $("avatarInput").click();
        });

        avatarArea.append(avatarButton);

        const help = document.createElement("div");
        help.className = "avatar-help";
        help.textContent = profile?.avatar_url
          ? "Tap your photo to change it."
          : "Tap + to add a profile picture.";

        avatarArea.append(help);

        if (profile?.avatar_url) {
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "delete-avatar-btn";
          deleteButton.textContent = "DELETE PHOTO";

          deleteButton.addEventListener("click", deleteAvatar);
          avatarArea.append(deleteButton);
        }

        const avatarMessage = document.createElement("div");
        avatarMessage.id = "avatarMessage";
        avatarMessage.className = "avatar-message";
        avatarArea.append(avatarMessage);

        section.append(avatarArea);

        addProfileRow(section, "NOWNEX ID", profile?.nownex_id);
        addProfileRow(section, "USERNAME", profile?.username);

        const date = profile?.created_at
          ? new Date(profile.created_at).toLocaleDateString("en-US")
          : "Unavailable";

        addProfileRow(section, "REGISTRATION DATE", date);
        addProfileRow(section, "TELEGRAM ID", profile?.telegram_id);
      }

      content.append(section);
    }

    function addProfileRow(parent, label, value) {
      const row = document.createElement("div");
      row.className = "row";

      const labelElement = document.createElement("div");
      labelElement.className = "label";
      labelElement.textContent = label;

      const valueElement = document.createElement("div");
      valueElement.className = "value";
      valueElement.textContent =
        value == null ? "Unavailable" : String(value);

      row.append(labelElement, valueElement);
      parent.append(row);
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
          const image = new Image();

          image.onload = () => {
            const canvas = document.createElement("canvas");
            const maxDimension = 1200;

            let width = image.width;
            let height = image.height;

            if (width > maxDimension || height > maxDimension) {
              const scale = Math.min(
                maxDimension / width,
                maxDimension / height
              );

              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }

            canvas.width = width;
            canvas.height = height;

            const context = canvas.getContext("2d");

            if (!context) {
              reject(new Error("Could not process this image."));
              return;
            }

            context.drawImage(image, 0, 0, width, height);

            let quality = 0.85;
            let dataUrl = canvas.toDataURL("image/jpeg", quality);

            while (
              dataUrl.length * 0.75 > 1900000 &&
              quality > 0.3
            ) {
              quality -= 0.1;
              dataUrl = canvas.toDataURL("image/jpeg", quality);
            }

            if (dataUrl.length * 0.75 > 2000000) {
              reject(new Error("Image is too large. Choose another photo."));
              return;
            }

            resolve(dataUrl);
          };

          image.onerror = () => {
            reject(new Error("Could not open this image."));
          };

          image.src = reader.result;
        };

        reader.onerror = () => {
          reject(new Error("Could not read this image."));
        };

        reader.readAsDataURL(file);
      });
    }

    $("avatarInput").addEventListener("change", async event => {
      const file = event.target.files?.[0];

      if (!file) return;

      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        showAvatarMessage("Please choose a JPG, PNG or WEBP image.");
        event.target.value = "";
        return;
      }

      if (avatarBusy) return;

      avatarBusy = true;
      showAvatarMessage("Preparing your photo...");

      try {
        const imageBase64 = await compressImage(file);

        showAvatarMessage("Uploading your photo...");

        const result = await callFunction(null, {
          action: "upload_avatar",
          imageBase64,
          mimeType: "image/jpeg"
        });

        profile.avatar_url = result.avatar_url;
        openPage("profile");

      } catch (error) {
        showAvatarMessage(error.message);
      } finally {
        avatarBusy = false;
        event.target.value = "";
      }
    });

    async function deleteAvatar() {
      if (avatarBusy || !profile?.avatar_url) return;

      const confirmed = confirm("Delete your profile picture?");

      if (!confirmed) return;

      avatarBusy = true;
      showAvatarMessage("Deleting photo...");

      try {
        await callFunction(null, {
          action: "delete_avatar"
        });

        profile.avatar_url = null;
        openPage("profile");

      } catch (error) {
        showAvatarMessage(error.message);
      } finally {
        avatarBusy = false;
      }
    }

    function showAvatarMessage(text) {
      const message = $("avatarMessage");

      if (message) {
        message.textContent = text;
      }
    }

    document.querySelectorAll(".menu button").forEach(button => {
      button.addEventListener("click", () => {
        openPage(button.dataset.page);
      });
    });

    $("registerForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (requestBusy) return;

      const username = $("usernameInput").value.trim();

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        showMessage(
          "registerMessage",
          "Use 3–20 characters: letters, numbers, or underscores."
        );
        return;
      }

      requestBusy = true;
      showMessage("registerMessage", "Creating your account...");

      try {
        const data = await callFunction(username);

        if (!data.registered) {
          throw new Error("Registration could not be confirmed.");
        }

        enterApp(data);

      } catch (error) {
        showMessage("registerMessage", error.message);

      } finally {
        requestBusy = false;
      }
    });

    async function startApp() {
      show("splash");

      const minimumSplash = new Promise(resolve => {
        setTimeout(resolve, 3000);
      });

      try {
        const [data] = await Promise.all([
          callFunction(),
          minimumSplash
        ]);

        if (data.registered) {
          enterApp(data);
        } else {
          show("register");
        }

      } catch (error) {
        await minimumSplash;
        show("loading");
        $("loadingMessage").textContent = error.message;
      }
    }

    startApp();
  </script>

</body>
</html>
