<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOWNEX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 12px 100px;
  background: linear-gradient(135deg,#020817,#063b70,#020817);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.logo {
  font-size: 38px;
  font-weight: bold;
  letter-spacing: 6px;
  margin: 25px 0;
}

video {
  width: 100%;
  max-width: 640px;
  border-radius: 16px;
  border: 2px solid #168cff;
  background: #000;
}

.bottom-menu {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: #04152c;
  border-top: 1px solid #168cff;
  padding: 12px 4px;
}

.bottom-menu button {
  background: none;
  border: none;
  color: #9ccfff;
  font-size: 12px;
  padding: 8px 4px;
  cursor: pointer;
}

.bottom-menu button span {
  display: block;
  font-size: 22px;
  margin-bottom: 5px;
}

.bottom-menu button.active {
  color: white;
}
</style>
</head>

<body>

<div class="logo">NOWNEX</div>

<video autoplay muted loop playsinline controls>
  <source src="2026-11-05%2011%3A50%3A39.mov" type="video/quicktime">
</video>

<div class="bottom-menu">
  <button class="active" data-tab="Packages">
    <span>📦</span>Packages
  </button>
  <button data-tab="Balance">
    <span>💰</span>Balance
  </button>
  <button data-tab="Statistics">
    <span>📊</span>Statistics
  </button>
  <button data-tab="Profile">
    <span>👤</span>Profile
  </button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

document.querySelectorAll(".bottom-menu button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".bottom-menu button")
      .forEach(item => item.classList.remove("active"));
    button.classList.add("active");
  });
});
</script>

</body>
</html>
