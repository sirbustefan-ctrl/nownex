<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>NOWNEX</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070d;
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    button, input { font: inherit; }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 24px 20px 110px;
    }

    .screen.active { display: flex; }

    #welcome {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      position: relative;
      min-height: 100vh;
    }

    .logo {
      position: absolute;
      z-index: 2;
      top: 35px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 7px;
      text-shadow: 0 0 20px #168cff;
    }

    .intro-video {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, #05070d55, #05070d22, #05070d);
    }

    .welcome-button {
      position: absolute;
      z-index: 3;
      bottom: 55px;
      border: 1px solid #329cff;
      background: #0878d9;
      color: white;
      padding: 15px 42px;
      border-radius: 30px;
      font-weight: bold;
      box-shadow: 0 0 25px #0878d9aa;
    }

    .form-screen {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .form-screen h1 {
      letter-spacing: 5px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #9ba8bb;
      margin-bottom: 30px;
    }

    .input {
      width: 100%;
      max-width: 360px;
      padding: 16px;
      margin: 8px 0;
      color: white;
      background: #111a29;
      border: 1px solid #263b56;
      border-radius: 14px;
      outline: none;
    }

    .primary {
      width: 100%;
      max-width: 360px;
      padding: 16px;
      margin-top: 16px;
      border: 0;
      border-radius: 15px;
      background: #0878d9;
      color: white;
      font-weight: bold;
    }

    .message {
      color: #ff7777;
      min-height: 22px;
      margin-top: 14px;
      max-width: 360px;
    }

    #home {
      flex-direction: column;
      align-items: center;
      padding-top: 55px;
    }

    .home-logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 7px;
      text-shadow: 0 0 20px #168cff;
      margin-bottom: 45px;
    }

    .welcome-text {
      color: #a9b8ca;
      margin-bottom: 10px;
    }

    .user-id {
      color: #4aa8ff;
      margin-top: 8px;
      font-size: 14px;
    }

    .content-area {
      width: 100%;
      max-width: 500px;
      margin-top: 35px;
      text-align: center;
    }

    .content-area h2 { letter-spacing: 2px; }

    .content-area p { color: #a9b8ca; }

    .bottom-menu {
      display: none;
      position: fixed;
      z-index: 10;
      left: 12px;
      right: 12px;
      bottom: 14px;
      padding: 9px 7px;
      background: rgba(12, 22, 38, .96);
      border: 1px solid #24466b;
      border-radius: 28px;
      box-shadow: 0 0 24px #0878d944;
      justify-content: space-around;
      gap: 4px;
      backdrop-filter: blur(15px);
    }

    .bottom-menu.visible { display: flex; }

    .menu-button {
      flex: 1;
      min-width: 0;
      padding: 12px 2px;
      border: 0;
      border-radius: 22px;
      background: transparent;
      color: #91a6bd;
      font-size: 11px;
      font-weight: bold;
    }

    .menu-button.active {
      color: white;
      background: #0878d9;
      box-shadow: 0 0 15px #0878d988;
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>

  <section id="welcome" class="screen active">
    <div class="logo">NOWNEX</div>
    <video class="intro-video"
      autoplay muted loop playsinline
      disablepictureinpicture
      controlslist="nodownload noplaybackrate">
      <source src="2026-11-05%2011%3A50%3A39.mov" type="video/quicktime">
    </video>
    <div class="video-overlay"></div>
    <button class="welcome-button" id="startButton">ENTER</button>
  </section>

  <section id="register" class="screen form-screen">
    <h1>NOWNEX</h1>
    <p class="subtitle">Create your account</p>

    <input
      id="username"
      class="input"
      type="text"
      maxlength="20"
      minlength="3"
      placeholder="Choose your username"
      autocomplete="username">

    <button class="primary" id="registerButton">REGISTER</button>
    <div class="message" id="registerMessage"></div>
  </section>

  <section id="home" class="screen">
    <div class="home-logo">NOWNEX</div>
    <div class="welcome-text">Welcome to NOWNEX</div>
    <div id="displayUsername"></div>
    <div class="user-id" id="displayId"></div>

    <div class="content-area" id="homeContent">
      <h2>HOME</h2>
      <p>Welcome to your NOWNEX account.</p>
    </div>
  </section>

  <nav class="bottom-menu" id="bottomMenu">
    <button class="menu-button active" data-page="home">HOME</button>
    <button class="menu-button" data-page="packages">PACKAGES</button>
    <button class="menu-button" data-page="balance">BALANCE</button>
    <button class="menu-button" data-page="statistics">STATISTICS</button>
    <button class="menu-button" data-page="profile">PROFILE</button>
  </nav>

  <script>
    const SUPABASE_URL = "https://gmgcyyhhdtqhtpfqbydg.supabase.co";
    const FUNCTION_URL = SUPABASE_URL + "/functions/v1/rapid-function";
    const PUBLISHABLE_KEY = "sb_publishable_CmYdFutjywR_FOG51tWr5Q_VMcI5Huj";

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    let currentUser = null;

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });

      document.getElementById(id).classList.add("active");
    }

    async function callRegistration(username) {
      if (!tg || !tg.initData) {
        throw new Error("Open NOWNEX from its Telegram bot.");
      }

      const response = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": PUBLISHABLE_KEY
        },
        body: JSON.stringify({
          initData: tg.initData,
          ...(username ? { username } : {})
        })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || "Something went wrong.");
      }

      return result;
    }

    function enterHome(user) {
      currentUser = user;

      document.getElementById("displayUsername").textContent =
        "@" + user.username;

      document.getElementById("displayId").textContent =
        user.nownex_id;

      document.getElementById("bottomMenu").classList.add("visible");
      showScreen("home");
    }

    document.getElementById("startButton").addEventListener("click", async () => {
      if (!tg || !tg.initData) {
        alert("Please open NOWNEX from Telegram.");
        return;
      }

      const button = document.getElementById("startButton");
      button.disabled = true;
      button.textContent = "LOADING...";

      try {
        const result = await callRegistration("");

        if (result.registered) {
          enterHome(result);
        } else {
          showScreen("register");
        }
      } catch (error) {
        alert(error.message);
        button.disabled = false;
        button.textContent = "ENTER";
      }
    });

    document.getElementById("registerButton").addEventListener("click", async () => {
      const usernameInput = document.getElementById("username");
      const message = document.getElementById("registerMessage");
      const button = document.getElementById("registerButton");

      const username = usernameInput.value.trim();

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        message.textContent = "Use 3–20 letters, numbers or underscores.";
        return;
      }

      button.disabled = true;
      button.textContent = "PLEASE WAIT...";
      message.textContent = "";

      try {
        const result = await callRegistration(username);

        if (result.registered) {
          enterHome(result);
        } else {
          message.textContent = "Registration could not be completed.";
        }
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "REGISTER";
      }
    });

    const pageContent = {
      home: ["HOME", "Welcome to your NOWNEX account."],
      packages: ["PACKAGES", "Packages will be available here."],
      balance: ["BALANCE", "Your balance will appear here."],
      statistics: ["STATISTICS", "Your statistics will appear here."],
      profile: ["PROFILE", "Your profile information will appear here."]
    };

    document.querySelectorAll(".menu-button").forEach(button => {
      button.addEventListener("click", () => {
        const page = button.dataset.page;

        document.querySelectorAll(".menu-button").forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");

        const content = pageContent[page];

        document.getElementById("homeContent").innerHTML =
          "<h2>" + content[0] + "</h2><p>" + content[1] + "</p>";
      });
    });
  </script>

</body>
</html>
