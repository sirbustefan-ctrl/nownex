<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOWNEX</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
  color: white;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background:
    linear-gradient(
      180deg,
      #98701f 0%,
      #765114 20%,
      #49330f 39%,
      #25202a 53%,
      #102d50 76%,
      #050d20 100%
    );
  background-attachment: fixed;
}

.glass {
  position: fixed;
  inset: 34% 0 30%;
  pointer-events: none;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,.12),
    rgba(255,255,255,.015) 45%,
    rgba(160,190,220,.10)
  );
  border-top: 1px solid rgba(255,255,255,.16);
  border-bottom: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  box-shadow: inset 0 0 35px rgba(255,255,255,.04);
}

main {
  position: relative;
  min-height: 100vh;
  padding: 35px 14px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.logo {
  font-size: clamp(42px, 11vw, 68px);
  font-weight: 900;
  letter-spacing: 5px;
  line-height: 1;
  background: linear-gradient(
    180deg,
    #fff1bc,
    #d5a747 35%,
    #80520e 65%,
    #e6c16d
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 3px 3px rgba(0,0,0,.7));
}

.logo span {
  background: linear-gradient(
    180deg,
    #e5f3ff,
    #8bb7dc 35%,
    #28577f 70%,
    #c3d9eb
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.scene {
  position: relative;
  width: min(100%, 560px);
  margin: 30px auto 0;
  flex: 1;
  min-height: 430px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.couple {
  display: block;
  width: 100%;
  max-height: 68vh;
  object-fit: contain;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 16px 25px rgba(0,0,0,.4));
}

/* USDT */

.usdt-mark {
  position: absolute;
  z-index: 5;
  left: 17%;
  top: 42%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transform-style: preserve-3d;
  animation: logoSpin 4s linear infinite;
  filter: drop-shadow(0 0 9px rgba(0,150,110,.35));
}

.tether-icon {
  width: 42px;
  height: 42px;
}

.usdt-name {
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #d5ad59;
  text-shadow: 0 2px 3px #000;
}

.usdt-code {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #e5edf7;
  text-shadow: 0 2px 5px #071426;
}

/* NOWNEX */

.nownex-mark {
  position: absolute;
  z-index: 5;
  right: 13%;
  top: 43%;
  font-size: clamp(17px, 4.5vw, 25px);
  font-weight: 1000;
  letter-spacing: 2px;
  white-space: nowrap;

  background: linear-gradient(
    180deg,
    #fff1bc,
    #d8ad54 28%,
    #8c5b16 55%,
    #e8c779 78%,
    #78500f
  );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;

  transform-style: preserve-3d;
  animation: logoSpin 4s linear infinite;

  filter:
    drop-shadow(0 2px 2px #000)
    drop-shadow(0 0 9px rgba(195,150,65,.35));
}

@keyframes logoSpin {
  from {
    transform: perspective(500px) rotateY(0deg);
  }
  to {
    transform: perspective(500px) rotateY(360deg);
  }
}

.bottom-message {
  margin-top: 12px;
  padding: 14px 20px;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #c9d7e8;
  text-shadow: 0 2px 8px #000;
}

@media(max-width:380px) {
  .scene {
    min-height: 390px;
  }

  .usdt-mark {
    left: 10%;
  }

  .nownex-mark {
    right: 8%;
  }
}
</style>
</head>

<body>

<div class="glass"></div>

<main>

  <div class="logo">NOW<span>NEX</span></div>

  <section class="scene">

    <img class="couple" src="couple.PNG" alt="NOWNEX couple">

    <div class="usdt-mark">
      <svg class="tether-icon" viewBox="0 0 100 100" aria-label="Tether logo">
        <circle cx="50" cy="50" r="46" fill="#26A17B"/>
        <path fill="#fff" d="M25 25h50v13H56v8c13 1 22 4 22 10 0 7-12 11-28 11S22 63 22 56c0-6 9-9 22-10v-8H25V25zm25 39c13 0 21-2 21-5s-8-5-21-5-21 2-21 5 8 5 21 5zm-5-18v14h10V46H45z"/>
      </svg>
      <div class="usdt-name">TETHER</div>
      <div class="usdt-code">USDT</div>
    </div>

    <div class="nownex-mark">NOWNEX</div>

  </section>

  <div class="bottom-message">© 2026</div>

</main>

</body>
</html>
