<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOWNEX</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
  color: white;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 50% 12%, rgba(255,235,170,.38), transparent 38%),
    radial-gradient(ellipse at 50% 75%, rgba(30,125,255,.32), transparent 45%),
    linear-gradient(
      180deg,
      #8b5b08 0%,
      #e5b94e 15%,
      rgba(255,245,210,.78) 39%,
      rgba(205,232,255,.68) 53%,
      #174e91 76%,
      #071b42 100%
    );
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .65;
  background-image:
    radial-gradient(2px 2px at 10% 18%, white 50%, transparent 100%),
    radial-gradient(2px 2px at 82% 14%, white 50%, transparent 100%),
    radial-gradient(1.5px 1.5px at 28% 48%, white 50%, transparent 100%),
    radial-gradient(2px 2px at 75% 62%, white 50%, transparent 100%),
    radial-gradient(1.5px 1.5px at 18% 83%, white 50%, transparent 100%),
    radial-gradient(2px 2px at 90% 88%, white 50%, transparent 100%);
  background-size: 260px 260px;
  animation: stars 8s ease-in-out infinite alternate;
}

@keyframes stars {
  from { opacity: .25; }
  to { opacity: .9; }
}

.glass {
  position: fixed;
  inset: 34% 0 30%;
  pointer-events: none;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,.30),
    rgba(255,255,255,.04) 45%,
    rgba(255,255,255,.20)
  );
  border-top: 1px solid rgba(255,255,255,.45);
  border-bottom: 1px solid rgba(255,255,255,.28);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  box-shadow:
    0 0 45px rgba(255,255,255,.16),
    inset 0 0 35px rgba(255,255,255,.13);
}

main {
  position: relative;
  min-height: 100vh;
  padding: 35px 14px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.logo {
  font-size: clamp(42px, 11vw, 68px);
  font-weight: 900;
  letter-spacing: 5px;
  line-height: 1;
  background: linear-gradient(
    180deg,
    #fff9d9 0%,
    #f9d56b 25%,
    #a66a0a 53%,
    #fff0a9 72%,
    #9a6108 100%
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter:
    drop-shadow(0 3px 1px rgba(65,35,0,.55))
    drop-shadow(0 0 14px rgba(255,225,130,.7));
}

.logo span {
  background: linear-gradient(
    180deg,
    #ffffff,
    #9edbff 30%,
    #267ac4 65%,
    #e2f6ff
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.scene {
  position: relative;
  width: min(100%, 560px);
  margin: 30px auto 0;
  flex: 1;
  min-height: 430px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.couple {
  display: block;
  width: 100%;
  max-height: 68vh;
  object-fit: contain;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 16px 25px rgba(0,0,0,.28));
}

.coin {
  position: absolute;
  z-index: 4;
  width: clamp(65px, 17vw, 94px);
  aspect-ratio: 1;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: clamp(12px, 3vw, 17px);
  letter-spacing: 1px;
  color: #fff9d8;
  transform-style: preserve-3d;
  animation: coinSpin 3s linear infinite;
}

.coin::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(
    135deg,
    #fff8c7,
    #d6a52d 28%,
    #80500a 55%,
    #ffdf75 78%,
    #fff4b9
  );
  border: 3px solid #ffe8a0;
  box-shadow:
    0 0 12px rgba(255,222,125,.9),
    0 0 30px rgba(255,208,75,.55),
    inset 0 0 12px rgba(255,255,255,.7);
}

.coin span {
  position: relative;
  z-index: 1;
  text-shadow: 0 2px 4px #694300;
  backface-visibility: hidden;
}

.coin.usdt {
  left: 18%;
  top: 42%;
}

.coin.nownex {
  right: 17%;
  top: 42%;
}

.coin.nownex::before {
  background: linear-gradient(
    135deg,
    #f5e6a5,
    #b98722 30%,
    #65420c 55%,
    #f5d66e 80%,
    #fff3bf
  );
}

@keyframes coinSpin {
  0% {
    transform: perspective(500px) rotateY(0deg);
  }
  100% {
    transform: perspective(500px) rotateY(360deg);
  }
}

.bottom-message {
  margin-top: 12px;
  padding: 14px 20px;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #fff8df;
  text-shadow: 0 2px 8px #071b42;
}

@media (max-width: 380px) {
  .scene {
    min-height: 390px;
  }

  .coin.usdt {
    left: 12%;
  }

  .coin.nownex {
    right: 12%;
  }
}
</style>
</head>

<body>

<div class="glass"></div>

<main>

  <div class="logo">NOW<span>NEX</span></div>

  <section class="scene">

    <img
      class="couple"
      src="couple.PNG"
      alt="NOWNEX couple"
    >

    <div class="coin usdt">
      <span>₮ USDT</span>
    </div>

    <div class="coin nownex">
      <span>NOWNEX</span>
    </div>

  </section>

  <div class="bottom-message">
    © 2026
  </div>

</main>

</body>
</html>
