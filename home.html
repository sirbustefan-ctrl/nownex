<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b55">
<title>NOWNEX HOME</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #102b55;
  color: white;
}

.home {
  min-height: 100vh;
  overflow: hidden;
  position: relative;
  padding: 20px 14px 45px;
  background: linear-gradient(
    to bottom,
    #d6a62e 0%,
    #f3d77c 30%,
    #173b70 30%,
    #071a38 100%
  );
}

/* LOGO */

.logo {
  text-align: center;
  font-size: clamp(38px, 10vw, 60px);
  font-weight: 1000;
  letter-spacing: 3px;
  margin: 8px 0 4px;
  text-shadow: 0 3px 12px #0005;
}

.now {
  color: #fff0a6;
}

.nex {
  color: #173b70;
  -webkit-text-stroke: 1px #ffe49a;
}

.subtitle {
  text-align: center;
  color: #fff4d0;
  font-size: 10px;
  letter-spacing: 5px;
  margin-bottom: 35px;
}

/* PEOPLE */

.scene {
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  position: relative;
}

.couple {
  width: 100%;
  position: relative;
}

.couple img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

/* COINS */

.hand-coin {
  position: absolute;
  width: 75px;
  height: 75px;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 600px;
  z-index: 5;
  pointer-events: none;
}

/* Positions can be adjusted after seeing the photo */

.girl-coin {
  left: 23%;
  top: 42%;
}

.boy-coin {
  right: 20%;
  top: 42%;
}

.coin {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 1000;
  animation: coinRotation 2.8s linear infinite;
  transform-style: preserve-3d;
  backface-visibility: visible;
  box-shadow: 0 0 22px #f8d66b99;
}

.usdt {
  color: white;
  background: linear-gradient(145deg, #39c6a2, #087e68);
  border: 4px solid #b9ffe9;
  font-size: 14px;
  text-shadow: 0 2px 5px #064e3b;
}

.usdt-symbol {
  font-size: 25px;
  margin-right: 3px;
}

.nownex-coin {
  color: #fff0a5;
  background: linear-gradient(145deg, #f6d779, #936515);
  border: 4px solid #fff0ad;
  font-size: 11px;
  text-shadow: 0 2px 5px #68440b;
}

@keyframes coinRotation {
  from {
    transform: rotateY(0deg);
  }
  to {
    transform: rotateY(360deg);
  }
}

/* BOTTOM TEXT */

.bottom-message {
  text-align: center;
  margin-top: 35px;
  color: #f8e5ae;
  font-weight: bold;
  letter-spacing: 3px;
  font-size: 13px;
  text-shadow: 0 2px 8px #0008;
}

/* MOBILE */

@media (max-width: 380px) {
  .hand-coin {
    width: 60px;
    height: 60px;
  }

  .coin {
    width: 55px;
    height: 55px;
    font-size: 11px;
  }

  .usdt-symbol {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<main class="home">

  <div class="logo">
    <span class="now">NOW</span><span class="nex">NEX</span>
  </div>

  <div class="subtitle">
    YOUR FUTURE STARTS HERE
  </div>

  <section class="scene">

    <div class="couple">

      <!-- Add your full-body couple photo as couple.png -->
      <img src="couple.png" alt="Elegant NOWNEX couple">

      <!-- USDT in the girl's hand -->
      <div class="hand-coin girl-coin">
        <div class="coin usdt">
          <span class="usdt-symbol">₮</span>USDT
        </div>
      </div>

      <!-- NOWNEX in the boy's hand -->
      <div class="hand-coin boy-coin">
        <div class="coin nownex-coin">
          NOWNEX
        </div>
      </div>

    </div>

  </section>

  <div class="bottom-message">
    DREAM BIG · BUILD YOUR FUTURE
  </div>

</main>

</body>
</html>
